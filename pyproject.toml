[project]
name = "distillery"
version = "0.1.0"
description = "Distillery: distill a large LLM into a small, cheap model for one task (support-ticket triage), with a teacher/student eval and a routing API."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ivan Savchenko" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "fastapi",
    "httpx",
    "jinja2",
    "numpy",
    "openai",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "pyyaml",
    "rich",
    "structlog",
    "typer",
    "uvicorn[standard]",
]

[project.optional-dependencies]
# Fine-tuning and local student inference (CPU wheels of torch by default, see [tool.uv.sources]).
train = ["accelerate", "peft", "safetensors", "torch", "transformers"]

[dependency-groups]
dev = ["mypy", "pytest", "ruff", "types-pyyaml"]

[project.scripts]
distillery = "distillery.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distillery"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: trains a tiny randomly initialised model (needs the `train` extra)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PTH", "N", "C4", "PIE", "RET", "TC"]
ignore = ["TC001", "TC002", "TC003", "RUF001", "RUF002"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Form", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["distillery"]

[[tool.mypy.overrides]]
module = ["transformers.*", "peft.*", "torch.*"]
ignore_missing_imports = true
follow_imports = "skip"
