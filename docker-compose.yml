# docker compose up  ->  http://localhost:8000  (dashboard at /, playground at /playground, API docs at /docs)
# Default: committed real-run results + offline fake student/teacher, no API keys or model downloads.
# A real LoRA student needs EXTRAS=train (CPU torch), STUDENT_BACKEND=hf and a mounted adapter (see README).
services:
  app:
    build:
      context: .
      args:
        EXTRAS: ${EXTRAS:-}
    image: distillery:latest
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DISTILLERY_CONFIG: ${DISTILLERY_CONFIG:-configs/demo.yaml}
      DISTILLERY_RUN_DIR: ${DISTILLERY_RUN_DIR:-results/openrouter-free-2026-10-05}
      STUDENT_BACKEND: ${STUDENT_BACKEND:-fake}
    volumes:
      - hf-cache:/home/app/.cache/huggingface
    restart: unless-stopped

volumes:
  hf-cache:
